# Ethereum RPC Proxy Configuration for RHEL/CentOS/Rocky Linux
# Apache HTTPD Configuration

# RPC backend address (localhost instead of Docker container name)
Define RPC_BACKEND 127.0.0.1:8545

# Whitelist path (RHEL path instead of Debian path)
Define WHITELIST_PATH /etc/httpd/conf.d/whitelist.json

# Listen on custom port
Listen 8888

# Server name
ServerName localhost

# Load required modules (ensure these exist in conf.modules.d)
LoadModule lua_module modules/mod_lua.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

# PID file location
PidFile /var/run/httpd/httpd.pid

# Error logging (RHEL path)
ErrorLog /var/log/httpd/rpc-proxy-error.log

# Log level
LogLevel warn

<VirtualHost *:8888>
    ServerName localhost

    # Proxy settings
    ProxyRequests Off
    ProxyPreserveHost On

    # Logging (RHEL path, use combined format)
    ErrorLog /var/log/httpd/rpc-proxy-error.log
    CustomLog /var/log/httpd/rpc-proxy-access.log combined

    # Health check endpoint - direct pass-through, no Lua filtering
    <Location /health>
        ProxyPass http://${RPC_BACKEND}/health
        ProxyPassReverse http://${RPC_BACKEND}/health
    </Location>

    # Statistics endpoint - Mock Server
    <Location /stats>
        ProxyPass http://${RPC_BACKEND}/stats
        ProxyPassReverse http://${RPC_BACKEND}/stats
    </Location>

    # Blocked records endpoint - Mock Server
    <Location /blocked>
        ProxyPass http://${RPC_BACKEND}/blocked
        ProxyPassReverse http://${RPC_BACKEND}/blocked
    </Location>

    # Allowed records endpoint - Mock Server
    <Location /allowed>
        ProxyPass http://${RPC_BACKEND}/allowed
        ProxyPassReverse http://${RPC_BACKEND}/allowed
    </Location>

    # RPC requests - Lua handling with whitelist filtering
    <Location /rpc>
        SetHandler lua-script
        # RHEL path for Lua scripts
        LuaMapHandler /rpc /etc/httpd/lua/rpc_proxy.lua rpc
    </Location>

    # Root path - forward to backend (for direct testing convenience)
    <Location />
        RewriteEngine On
        RewriteRule ^/rpc$ - [L]
        RewriteRule ^/$ http://${RPC_BACKEND}/ [P,L]
        ProxyPass http://${RPC_BACKEND}/
        ProxyPassReverse http://${RPC_BACKEND}/
    </Location>

    # CORS headers
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
    </IfModule>
</VirtualHost>
