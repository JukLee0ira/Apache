# Apache2 Ethereum RPC Proxy Configuration

# RPC backend address
Define RPC_BACKEND rpc-backend:8545

# Whitelist path
Define WHITELIST_PATH /etc/apache2/config/whitelist.json

<VirtualHost *:80>
    ServerName localhost

    # Enable proxy
    ProxyRequests Off
    ProxyPreserveHost On

    # Logging
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Health check endpoint (direct pass-through, does not go through Lua filtering)
    <Location /health>
        ProxyPass http://${RPC_BACKEND}/health
        ProxyPassReverse http://${RPC_BACKEND}/health
    </Location>

    # Statistics endpoint (Mock Server)
    <Location /stats>
        ProxyPass http://${RPC_BACKEND}/stats
        ProxyPassReverse http://${RPC_BACKEND}/stats
    </Location>

    # RPC requests - Lua handling
    <Location /rpc>
        SetHandler lua-script
        LuaMapHandler /rpc /usr/local/apache2/scripts/rpc_proxy.lua rpc
    </Location>

    # Root path / -> forward to backend (for direct testing convenience)
    <Location />
        # Only /rpc goes through Lua, others are direct proxy
        RewriteEngine On
        RewriteRule ^/rpc$ - [L]
        RewriteRule ^/$ http://${RPC_BACKEND}/ [P,L]
        ProxyPass http://${RPC_BACKEND}/
        ProxyPassReverse http://${RPC_BACKEND}/
    </Location>

    # Allow OPTIONS / CORS preflight
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
    </IfModule>
</VirtualHost>
